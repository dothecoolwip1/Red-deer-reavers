name: Site Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: npm run check:js

      - name: Build production site
        run: npm run build
        env:
          SITE_URL: https://dothecoolwip1.github.io/Reavers-Site/

      - name: Static integrity
        run: npm run check

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/reavers-http.log 2>&1 &
          echo $! > /tmp/reavers-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/index.html >/dev/null

      - name: Accessibility
        run: npm run a11y

      - name: Lighthouse
        run: npm run lighthouse

      - name: Internal link check
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --offline '_site/**/*.html'
          fail: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/results
          if-no-files-found: ignore
