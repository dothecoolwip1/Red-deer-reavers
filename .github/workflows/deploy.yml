name: Build Reavers Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reavers-assets
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build optimized static site
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Validate static output
        run: npm run check

      - name: Sync generated runtime assets
        run: |
          rm -rf assets/generated vendor
          mkdir -p assets
          cp -R _site/assets/generated assets/generated
          cp -R _site/vendor vendor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated vendor package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated Reavers assets"
            git push
          fi

